<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="How Proof of Stake secures a network" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="pos-stake-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="currentColor" fill-opacity=".45"/>
    </marker>
    <marker id="pos-stake-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="var(--diagram-accent, #ffa726)"/>
    </marker>
  </defs>
  <style>
    .t  { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .l  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
    .s  { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; fill-opacity: .62; }
    .m  { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: .72; }
    .a  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .g  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent-2, #eac168); }
    .box  { fill: none; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .fill { fill: currentColor; fill-opacity: .05; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .acc  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .accf { fill: var(--diagram-accent, #ffa726); fill-opacity: .1; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .gold { fill: none; stroke: var(--diagram-accent-2, #eac168); stroke-width: 1.75; }
    .ln   { fill: none; stroke: currentColor; stroke-opacity: .45; stroke-width: 1.5; marker-end: url(#pos-stake-arw); }
    .lnd  { fill: none; stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .lna  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; marker-end: url(#pos-stake-acc); }
    .dot  { fill: currentColor; fill-opacity: .32; }
    .dota { fill: var(--diagram-accent, #ffa726); fill-opacity: .85; }
  </style>
  <text class="l" x="40" y="34">The penalty is the stake itself, not the electricity bill</text>

  <rect class="fill" x="40" y="112" width="140" height="82" rx="8"/>
  <text class="l" x="58" y="144">Validator</text>
  <text class="s" x="58" y="166">locks own coins</text>
  <path class="ln" d="M182 153 H218"/>

  <rect class="fill" x="222" y="112" width="150" height="82" rx="8"/>
  <text class="l" x="240" y="144">Proposes a block</text>
  <text class="s" x="240" y="166">selected by the protocol</text>

  <path class="lna" d="M374 140 L424 92"/>
  <path class="ln" d="M374 166 L424 214"/>

  <rect class="accf" x="428" y="56" width="160" height="72" rx="8"/>
  <text class="a" x="446" y="84">Honest</text>
  <text class="s" x="446" y="106">rewards + fees</text>

  <rect class="fill" x="428" y="178" width="160" height="72" rx="8"/>
  <text class="l" x="446" y="206">Dishonest</text>
  <text class="g" x="446" y="228">stake slashed</text>

  <text class="s" x="40" y="242">stake =</text>
  <text class="s" x="40" y="260">collateral</text>
  <circle class="dota" cx="62" cy="212" r="9"/>
  <circle class="dota" cx="82" cy="212" r="9"/>
  <circle class="dota" cx="102" cy="212" r="9"/>

  <text class="s" x="40" y="286">No hardware race: capital at risk replaces energy spent, and the cost of lying stays real.</text>
</svg>
