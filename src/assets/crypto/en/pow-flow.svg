<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="How a Bitcoin transaction reaches a block" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="pow-flow-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="currentColor" fill-opacity=".45"/>
    </marker>
    <marker id="pow-flow-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="var(--diagram-accent, #ffa726)"/>
    </marker>
  </defs>
  <style>
    .t  { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .l  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
    .s  { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; fill-opacity: .62; }
    .m  { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: .72; }
    .a  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .g  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent-2, #eac168); }
    .box  { fill: none; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .fill { fill: currentColor; fill-opacity: .05; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .acc  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .accf { fill: var(--diagram-accent, #ffa726); fill-opacity: .1; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .gold { fill: none; stroke: var(--diagram-accent-2, #eac168); stroke-width: 1.75; }
    .ln   { fill: none; stroke: currentColor; stroke-opacity: .45; stroke-width: 1.5; marker-end: url(#pow-flow-arw); }
    .lnd  { fill: none; stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .lna  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; marker-end: url(#pow-flow-acc); }
    .dot  { fill: currentColor; fill-opacity: .32; }
    .dota { fill: var(--diagram-accent, #ffa726); fill-opacity: .85; }
  </style>
  <text class="l" x="40" y="34">From "send" to a finalised block</text>

  <rect class="fill" x="40" y="72" width="118" height="78" rx="8"/>
  <text class="l" x="58" y="102">Wallet</text>
  <text class="s" x="58" y="124">press send</text>
  <path class="ln" d="M160 111 H196"/>

  <rect class="fill" x="200" y="72" width="130" height="78" rx="8"/>
  <text class="l" x="218" y="102">mempool</text>
  <text class="s" x="218" y="124">pending requests</text>
  <circle class="dot" cx="222" cy="138" r="4"/>
  <circle class="dot" cx="236" cy="138" r="4"/>
  <circle class="dot" cx="250" cy="138" r="4"/>
  <circle class="dot" cx="264" cy="138" r="4"/>
  <path class="ln" d="M332 111 H368"/>

  <rect class="fill" x="372" y="62" width="150" height="98" rx="8"/>
  <text class="l" x="390" y="90">Miners</text>
  <text class="s" x="390" y="110">solve the puzzle</text>
  <circle class="dota" cx="398" cy="134" r="10"/>
  <circle class="dot" cx="428" cy="134" r="10"/>
  <circle class="dot" cx="458" cy="134" r="10"/>
  <path class="lna" d="M524 111 H560"/>

  <rect class="accf" x="564" y="72" width="116" height="78" rx="8"/>
  <text class="a" x="582" y="102">Block</text>
  <text class="s" x="582" y="124">≈ every 10 min</text>

  <path class="ln" d="M622 154 V196 H360"/>
  <rect class="fill" x="150" y="196" width="210" height="52" rx="8"/>
  <text class="l" x="168" y="220">Every node verifies</text>
  <text class="s" x="168" y="238">51% agree → block appended</text>

  <text class="s" x="40" y="284">Rewriting an old block means redoing all the work after it — more miners make that harder, not easier.</text>
</svg>
