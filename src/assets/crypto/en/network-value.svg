<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Estimating the value of a network" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="network-value-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="currentColor" fill-opacity=".45"/>
    </marker>
    <marker id="network-value-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="var(--diagram-accent, #ffa726)"/>
    </marker>
  </defs>
  <style>
    .t  { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .l  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
    .s  { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; fill-opacity: .62; }
    .m  { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: .72; }
    .a  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .g  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent-2, #eac168); }
    .box  { fill: none; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .fill { fill: currentColor; fill-opacity: .05; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .acc  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .accf { fill: var(--diagram-accent, #ffa726); fill-opacity: .1; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .gold { fill: none; stroke: var(--diagram-accent-2, #eac168); stroke-width: 1.75; }
    .ln   { fill: none; stroke: currentColor; stroke-opacity: .45; stroke-width: 1.5; marker-end: url(#network-value-arw); }
    .lnd  { fill: none; stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .lna  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; marker-end: url(#network-value-acc); }
    .dot  { fill: currentColor; fill-opacity: .32; }
    .dota { fill: var(--diagram-accent, #ffa726); fill-opacity: .85; }
  </style>
  <text class="l" x="40" y="34">Metcalfe's law, applied to a blockchain</text>

  <rect class="accf" x="40" y="58" width="640" height="56" rx="8"/>
  <text class="a" x="360" y="92" text-anchor="middle">network value  ≈  active users  ×  traded volume</text>

  <text class="s" x="40" y="146">active users</text>
  <circle class="dot" cx="58" cy="176" r="7"/>
  <circle class="dot" cx="80" cy="176" r="7"/>
  <circle class="dota" cx="102" cy="176" r="7"/>
  <circle class="dota" cx="124" cy="176" r="7"/>
  <circle class="dota" cx="146" cy="176" r="7"/>
  <text class="s" x="40" y="206">each new participant adds</text>
  <text class="s" x="40" y="224">connections, not just a head</text>

  <line class="lnd" x1="240" y1="140" x2="240" y2="248"/>

  <path class="lnd" d="M290 244 H664 M290 244 V146"/>
  <path d="M294 238 C404 232 508 198 660 156" fill="none" stroke="currentColor" stroke-opacity=".45" stroke-width="1.6"/>
  <path d="M294 232 C408 226 512 186 658 148" fill="none" stroke="var(--diagram-accent, #ffa726)" stroke-width="1.75" stroke-dasharray="5 4"/>
  <path d="M302 158 H330" stroke="var(--diagram-accent, #ffa726)" stroke-width="1.75" stroke-dasharray="5 4"/>
  <text class="s" x="338" y="162">model</text>
  <path d="M302 180 H330" stroke="currentColor" stroke-opacity=".45" stroke-width="1.6"/>
  <text class="s" x="338" y="184">price</text>
  <text class="s" x="600" y="268">time</text>

  <text class="s" x="40" y="286">Both inputs are public, which is why the same model tracks very different networks.</text>
</svg>
