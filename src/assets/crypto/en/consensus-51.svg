<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 312" role="img" aria-label="Why consensus needs an economic cost" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="consensus-51-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="currentColor" fill-opacity=".45"/>
    </marker>
    <marker id="consensus-51-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="var(--diagram-accent, #ffa726)"/>
    </marker>
  </defs>
  <style>
    .t  { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .l  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
    .s  { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; fill-opacity: .62; }
    .m  { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: .72; }
    .a  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .g  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent-2, #eac168); }
    .box  { fill: none; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .fill { fill: currentColor; fill-opacity: .05; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .acc  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .accf { fill: var(--diagram-accent, #ffa726); fill-opacity: .1; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .gold { fill: none; stroke: var(--diagram-accent-2, #eac168); stroke-width: 1.75; }
    .ln   { fill: none; stroke: currentColor; stroke-opacity: .45; stroke-width: 1.5; marker-end: url(#consensus-51-arw); }
    .lnd  { fill: none; stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .lna  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; marker-end: url(#consensus-51-acc); }
    .dot  { fill: currentColor; fill-opacity: .32; }
    .dota { fill: var(--diagram-accent, #ffa726); fill-opacity: .85; }
  </style>
  <text class="l" x="40" y="34">A vote is only worth something if it costs something</text>
  <circle class="dota" cx="90" cy="95" r="15"/>  <circle class="dota" cx="145" cy="95" r="15"/>  <circle class="dota" cx="200" cy="95" r="15"/>  <circle class="dota" cx="90" cy="150" r="15"/>  <circle class="dota" cx="145" cy="150" r="15"/>  <circle class="dot" cx="200" cy="150" r="15"/>  <circle class="dot" cx="90" cy="205" r="15"/>  <circle class="dot" cx="145" cy="205" r="15"/>  <circle class="dot" cx="200" cy="205" r="15"/>
  <text class="a" x="60" y="248">5 of 9 nodes agree</text>
  <text class="s" x="60" y="268">→ that state is accepted as the truth</text>
  <line class="lnd" x1="330" y1="60" x2="330" y2="250"/>
  <circle class="accf" cx="450" cy="118" r="22"/>
  <text class="s" x="424" y="164">1 actor</text>
  <circle class="box" cx="545" cy="95" r="14" stroke-dasharray="3 3"/>  <circle class="box" cx="600" cy="75" r="14" stroke-dasharray="3 3"/>  <circle class="box" cx="600" cy="135" r="14" stroke-dasharray="3 3"/>  <circle class="box" cx="545" cy="160" r="14" stroke-dasharray="3 3"/>  <circle class="box" cx="650" cy="105" r="14" stroke-dasharray="3 3"/>
  <path class="lnd" d="M470 118 L529 95"/>  <path class="lnd" d="M470 118 L584 75"/>  <path class="lnd" d="M470 118 L584 135"/>  <path class="lnd" d="M470 118 L529 160"/>  <path class="lnd" d="M470 118 L634 105"/>
  <text class="l" x="520" y="210">sybil attack</text>
  <text class="s" x="520" y="230">free votes, bought in bulk</text>
  <rect class="fill" x="40" y="282" width="0" height="0"/>
  <text class="g" x="330" y="300" text-anchor="middle">Proof of Work and Proof of Stake attach a real cost to every vote — a false one loses it</text>
</svg>
