<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-label="How a decentralized exchange pool works" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="amm-pool-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="currentColor" fill-opacity=".45"/>
    </marker>
    <marker id="amm-pool-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="var(--diagram-accent, #ffa726)"/>
    </marker>
  </defs>
  <style>
    .t  { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .l  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
    .s  { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; fill-opacity: .62; }
    .m  { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: .72; }
    .a  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .g  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent-2, #eac168); }
    .box  { fill: none; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .fill { fill: currentColor; fill-opacity: .05; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .acc  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .accf { fill: var(--diagram-accent, #ffa726); fill-opacity: .1; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .gold { fill: none; stroke: var(--diagram-accent-2, #eac168); stroke-width: 1.75; }
    .ln   { fill: none; stroke: currentColor; stroke-opacity: .45; stroke-width: 1.5; marker-end: url(#amm-pool-arw); }
    .lnd  { fill: none; stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .lna  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; marker-end: url(#amm-pool-acc); }
    .dot  { fill: currentColor; fill-opacity: .32; }
    .dota { fill: var(--diagram-accent, #ffa726); fill-opacity: .85; }
  </style>
  <text class="l" x="40" y="34">No order book, no custodian — the pool quotes the price</text>

  <rect class="accf" x="262" y="96" width="200" height="120" rx="10"/>
  <text class="a" x="362" y="128" text-anchor="middle">liquidity pool</text>
  <line class="lnd" x1="362" y1="140" x2="362" y2="200"/>
  <text class="l" x="312" y="170" text-anchor="middle">token A</text>
  <text class="l" x="412" y="170" text-anchor="middle">token B</text>
  <text class="s" x="312" y="192" text-anchor="middle">reserve</text>
  <text class="s" x="412" y="192" text-anchor="middle">reserve</text>

  <rect class="fill" x="40" y="116" width="150" height="80" rx="8"/>
  <text class="l" x="58" y="146">Trader</text>
  <text class="s" x="58" y="168">keeps own keys</text>
  <path class="ln" d="M192 140 H258"/>
  <path class="ln" d="M258 176 H194"/>
  <text class="s" x="225" y="132" text-anchor="middle">A in</text>
  <text class="s" x="225" y="200" text-anchor="middle">B out</text>

  <rect class="fill" x="534" y="116" width="146" height="80" rx="8"/>
  <text class="l" x="552" y="146">Providers</text>
  <text class="s" x="552" y="168">deposit both sides</text>
  <path class="ln" d="M532 140 H468"/>
  <path class="lna" d="M466 176 H530"/>
  <text class="a" x="500" y="200" text-anchor="middle">fee share</text>

  <rect class="box" x="262" y="240" width="200" height="40" rx="8"/>
  <text class="l" x="362" y="266" text-anchor="middle">holders vote on changes</text>

  <text class="s" x="40" y="298">Deeper pools mean a trade moves the price less — that depth is what liquidity actually means.</text>
</svg>
