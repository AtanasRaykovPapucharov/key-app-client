<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="The four Ethereum token standards" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="token-standards-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="currentColor" fill-opacity=".45"/>
    </marker>
    <marker id="token-standards-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="var(--diagram-accent, #ffa726)"/>
    </marker>
  </defs>
  <style>
    .t  { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .l  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
    .s  { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; fill-opacity: .62; }
    .m  { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: .72; }
    .a  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .g  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent-2, #eac168); }
    .box  { fill: none; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .fill { fill: currentColor; fill-opacity: .05; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .acc  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .accf { fill: var(--diagram-accent, #ffa726); fill-opacity: .1; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .gold { fill: none; stroke: var(--diagram-accent-2, #eac168); stroke-width: 1.75; }
    .ln   { fill: none; stroke: currentColor; stroke-opacity: .45; stroke-width: 1.5; marker-end: url(#token-standards-arw); }
    .lnd  { fill: none; stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .lna  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; marker-end: url(#token-standards-acc); }
    .dot  { fill: currentColor; fill-opacity: .32; }
    .dota { fill: var(--diagram-accent, #ffa726); fill-opacity: .85; }
  </style>
  <text class="l" x="40" y="34">What each standard lets you build</text>

  <rect class="fill" x="40" y="58" width="152" height="182" rx="8"/>
  <text class="t" x="58" y="86">ERC-20</text>
  <text class="s" x="58" y="108">fungible</text>
  <rect class="acc" x="58" y="126" width="26" height="26" rx="4"/>
  <rect class="acc" x="92" y="126" width="26" height="26" rx="4"/>
  <rect class="acc" x="126" y="126" width="26" height="26" rx="4"/>
  <rect class="acc" x="58" y="160" width="26" height="26" rx="4"/>
  <rect class="acc" x="92" y="160" width="26" height="26" rx="4"/>
  <rect class="acc" x="126" y="160" width="26" height="26" rx="4"/>
  <text class="s" x="58" y="216">every unit identical</text>

  <rect class="fill" x="212" y="58" width="152" height="182" rx="8"/>
  <text class="t" x="230" y="86">ERC-721</text>
  <text class="s" x="230" y="108">non-fungible</text>
  <rect class="gold" x="230" y="126" width="30" height="30" rx="4"/>
  <circle class="gold" cx="292" cy="141" r="15"/>
  <path class="gold" d="M336 126 351 156 321 156 Z"/>
  <text class="s" x="230" y="216">each one unique</text>

  <rect class="fill" x="384" y="58" width="152" height="182" rx="8"/>
  <text class="t" x="402" y="86">ERC-1155</text>
  <text class="s" x="402" y="108">both, in one contract</text>
  <rect class="acc" x="402" y="126" width="26" height="26" rx="4"/>
  <rect class="acc" x="436" y="126" width="26" height="26" rx="4"/>
  <circle class="gold" cx="496" cy="139" r="14"/>
  <rect class="box" x="402" y="168" width="112" height="26" rx="4"/>
  <text class="s" x="410" y="186">batched transfers</text>
  <text class="s" x="402" y="216">far cheaper gas</text>

  <rect class="fill" x="556" y="58" width="124" height="182" rx="8"/>
  <text class="t" x="574" y="86">ERC-998</text>
  <text class="s" x="574" y="108">composable</text>
  <rect class="gold" x="574" y="126" width="86" height="68" rx="6"/>
  <rect class="acc" x="586" y="140" width="24" height="20" rx="3"/>
  <rect class="acc" x="618" y="140" width="24" height="20" rx="3"/>
  <rect class="acc" x="586" y="166" width="24" height="20" rx="3"/>
  <rect class="acc" x="618" y="166" width="24" height="20" rx="3"/>
  <text class="s" x="574" y="216">an NFT of NFTs</text>

  <text class="s" x="40" y="278">Other networks rename the same ideas — Binance Smart Chain calls them BEP-20, BEP-721 and so on.</text>
</svg>
