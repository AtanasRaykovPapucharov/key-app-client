<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-label="Seven checks before investing in a project" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="analysis-steps-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="currentColor" fill-opacity=".45"/>
    </marker>
    <marker id="analysis-steps-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="var(--diagram-accent, #ffa726)"/>
    </marker>
  </defs>
  <style>
    .t  { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .l  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
    .s  { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; fill-opacity: .62; }
    .m  { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: .72; }
    .a  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .g  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent-2, #eac168); }
    .box  { fill: none; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .fill { fill: currentColor; fill-opacity: .05; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .acc  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .accf { fill: var(--diagram-accent, #ffa726); fill-opacity: .1; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .gold { fill: none; stroke: var(--diagram-accent-2, #eac168); stroke-width: 1.75; }
    .ln   { fill: none; stroke: currentColor; stroke-opacity: .45; stroke-width: 1.5; marker-end: url(#analysis-steps-arw); }
    .lnd  { fill: none; stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .lna  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; marker-end: url(#analysis-steps-acc); }
    .dot  { fill: currentColor; fill-opacity: .32; }
    .dota { fill: var(--diagram-accent, #ffa726); fill-opacity: .85; }
  </style>
  <text class="l" x="40" y="34">Seven checks, in order</text>
  <circle class="accf" cx="62" cy="82" r="16"/>
  <text class="a" x="62" y="87" text-anchor="middle">1</text>
  <text class="l" x="92" y="87">What problem does it solve?</text>
  <circle class="accf" cx="62" cy="140" r="16"/>
  <text class="a" x="62" y="145" text-anchor="middle">2</text>
  <text class="l" x="92" y="145">Who are the competitors?</text>
  <circle class="accf" cx="62" cy="198" r="16"/>
  <text class="a" x="62" y="203" text-anchor="middle">3</text>
  <text class="l" x="92" y="203">Transaction volume</text>
  <circle class="accf" cx="62" cy="256" r="16"/>
  <text class="a" x="62" y="261" text-anchor="middle">4</text>
  <text class="l" x="92" y="261">Active wallets</text>
  <circle class="accf" cx="392" cy="82" r="16"/>
  <text class="a" x="392" y="87" text-anchor="middle">5</text>
  <text class="l" x="422" y="87">How is income paid out?</text>
  <circle class="accf" cx="392" cy="140" r="16"/>
  <text class="a" x="392" y="145" text-anchor="middle">6</text>
  <text class="l" x="422" y="145">How decentralized is it?</text>
  <circle class="accf" cx="392" cy="198" r="16"/>
  <text class="a" x="392" y="203" text-anchor="middle">7</text>
  <text class="l" x="422" y="203">How strong is the community?</text>
  <line class="lnd" x1="352" y1="60" x2="352" y2="256"/>
  <rect class="box" x="40" y="292" width="640" height="42" rx="8"/>
  <text class="s" x="360" y="318" text-anchor="middle">Following fixed rules is what separates an investment from a bet on marketing.</text>
</svg>
