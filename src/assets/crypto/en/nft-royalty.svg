<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 290" role="img" aria-label="How an NFT royalty follows every resale" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="nft-royalty-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="currentColor" fill-opacity=".45"/>
    </marker>
    <marker id="nft-royalty-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="var(--diagram-accent, #ffa726)"/>
    </marker>
  </defs>
  <style>
    .t  { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .l  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
    .s  { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; fill-opacity: .62; }
    .m  { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: .72; }
    .a  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .g  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent-2, #eac168); }
    .box  { fill: none; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .fill { fill: currentColor; fill-opacity: .05; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .acc  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .accf { fill: var(--diagram-accent, #ffa726); fill-opacity: .1; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .gold { fill: none; stroke: var(--diagram-accent-2, #eac168); stroke-width: 1.75; }
    .ln   { fill: none; stroke: currentColor; stroke-opacity: .45; stroke-width: 1.5; marker-end: url(#nft-royalty-arw); }
    .lnd  { fill: none; stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .lna  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; marker-end: url(#nft-royalty-acc); }
    .dot  { fill: currentColor; fill-opacity: .32; }
    .dota { fill: var(--diagram-accent, #ffa726); fill-opacity: .85; }
  </style>
  <text class="l" x="40" y="34">The royalty lives in the token, not in the marketplace</text>

  <rect class="accf" x="40" y="96" width="140" height="80" rx="8"/>
  <text class="a" x="58" y="128">Creator</text>
  <text class="s" x="58" y="150">mints the token</text>

  <path class="ln" d="M182 136 H222"/>

  <rect class="fill" x="226" y="106" width="130" height="60" rx="8"/>
  <text class="l" x="244" y="132">first sale</text>
  <text class="s" x="244" y="152">100</text>
  <path class="ln" d="M358 136 H388"/>

  <rect class="fill" x="392" y="106" width="130" height="60" rx="8"/>
  <text class="l" x="410" y="132">resale</text>
  <text class="s" x="410" y="152">200</text>
  <path class="ln" d="M524 136 H554"/>

  <rect class="fill" x="558" y="106" width="122" height="60" rx="8"/>
  <text class="l" x="576" y="132">resale</text>
  <text class="s" x="576" y="152">450</text>

  <path class="lnd" d="M291 104 V74 M457 104 V74 M619 104 V74"/>
  <path class="lna" d="M640 74 H110 V88"/>
  <text class="a" x="400" y="64" text-anchor="middle">10% of every resale returns to the creator</text>

  <text class="s" x="40" y="210">In the traditional market the whole resale gain goes to the seller.</text>
  <text class="s" x="40" y="232">Here a share returns to the creator automatically, on every hand it passes through.</text>
  <text class="s" x="40" y="268">Provenance is public: who minted it and when is recorded permanently.</text>
</svg>
