  <rect class="box" x="256" y="78" width="18" height="18" rx="3"/>
  <rect class="box" x="74" y="104" width="18" height="18" rx="3"/>
  <rect class="box" x="100" y="104" width="18" height="18" rx="3"/>
  <rect class="box" x="126" y="104" width="18" height="18" rx="3"/>
  <rect class="box" x="152" y="104" width="18" height="18" rx="3"/>
