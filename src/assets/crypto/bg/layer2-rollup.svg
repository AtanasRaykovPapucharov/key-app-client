  <text class="a" x="264" y="236">блок</text>
  <text class="s" x="264" y="256">съдържа пакета</text>
  <rect class="fill" x="440" y="206" width="180" height="62" rx="8"/>
  <text class="l" x="458" y="244">блок</text>

  <text class="s" x="40" y="302">Таксата за това място се дели между всички транзакции в пакета; всеки може да оспори нечестен пакет.</text>
