  <rect class="box" x="256" y="104" width="18" height="18" rx="3"/>
  <text class="s" x="52" y="166">стотици транзакции</text>

  <path class="lna" d="M304 101 H372"/>
  <text class="a" x="338" y="90" text-anchor="middle">компресия</text>

  <rect class="accf" x="380" y="66" width="130" height="70" rx="8"/>
  <text class="a" x="398" y="96">1 пакет</text>
  <text class="s" x="398" y="118">една обща такса</text>

  <path class="lna" d="M445 140 V196"/>

  <text class="s" x="52" y="196">Layer 1</text>
  <rect class="fill" x="52" y="206" width="180" height="62" rx="8"/>
  <text class="l" x="70" y="244">блок</text>
