<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 258" role="img" aria-label="Блокове, свързани чрез хешове" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="blockchain-chain-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="currentColor" fill-opacity=".45"/>
    </marker>
    <marker id="blockchain-chain-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="var(--diagram-accent, #ffa726)"/>
    </marker>
  </defs>
  <style>
    .t  { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .l  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
    .s  { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; fill-opacity: .62; }
    .m  { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: .72; }
    .a  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .g  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent-2, #eac168); }
    .box  { fill: none; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .fill { fill: currentColor; fill-opacity: .05; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .acc  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .accf { fill: var(--diagram-accent, #ffa726); fill-opacity: .1; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .gold { fill: none; stroke: var(--diagram-accent-2, #eac168); stroke-width: 1.75; }
    .lnd  { fill: none; stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .ln   { fill: none; stroke: currentColor; stroke-opacity: .45; stroke-width: 1.5; marker-end: url(#blockchain-chain-arw); }
    .lna  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; marker-end: url(#blockchain-chain-acc); }
    .dot  { fill: currentColor; fill-opacity: .32; }
    .dota { fill: var(--diagram-accent, #ffa726); fill-opacity: .85; }
  </style>
  <text class="l" x="40" y="34">Всеки блок носи хеша на предишния</text>
  <rect class="fill" x="40" y="60" width="190" height="150" rx="8"/>
  <text class="t" x="56" y="86">Блок 811</text>
  <text class="s" x="56" y="110">пред. хеш</text>
  <text class="m" x="56" y="128">0x7a19…</text>
  <line class="lnd" x1="56" y1="142" x2="214" y2="142"/>
  <text class="s" x="56" y="162">транзакции</text>
  <text class="s" x="56" y="196">хеш</text>
  <text class="a" x="102" y="196">0x4c02…</text>
  <rect class="fill" x="265" y="60" width="190" height="150" rx="8"/>
  <text class="t" x="281" y="86">Блок 812</text>
  <text class="s" x="281" y="110">пред. хеш</text>
  <text class="m" x="281" y="128">0x4c02…</text>
  <line class="lnd" x1="281" y1="142" x2="439" y2="142"/>
  <text class="s" x="281" y="162">транзакции</text>
  <text class="s" x="281" y="196">хеш</text>
  <text class="a" x="327" y="196">0xb18f…</text>
  <rect class="fill" x="490" y="60" width="190" height="150" rx="8"/>
  <text class="t" x="506" y="86">Блок 813</text>
  <text class="s" x="506" y="110">пред. хеш</text>
  <text class="m" x="506" y="128">0xb18f…</text>
  <line class="lnd" x1="506" y1="142" x2="664" y2="142"/>
  <text class="s" x="506" y="162">транзакции</text>
  <text class="s" x="506" y="196">хеш</text>
  <text class="a" x="552" y="196">0x2de7…</text>
  <path class="lna" d="M232 135 H261"/>
  <path class="lna" d="M457 135 H486"/>
  <text class="s" x="40" y="240">Промяна на един байт в стар блок чупи всички следващи хешове — намесата е видима за всеки нод.</text>
