<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Как работи блокчейн оракъл" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="oracle-bridge-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="currentColor" fill-opacity=".45"/>
    </marker>
    <marker id="oracle-bridge-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="var(--diagram-accent, #ffa726)"/>
    </marker>
  </defs>
  <style>
    .t  { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .l  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
    .s  { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; fill-opacity: .62; }
    .m  { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: .72; }
    .a  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .g  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent-2, #eac168); }
    .box  { fill: none; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .fill { fill: currentColor; fill-opacity: .05; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .acc  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .accf { fill: var(--diagram-accent, #ffa726); fill-opacity: .1; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .gold { fill: none; stroke: var(--diagram-accent-2, #eac168); stroke-width: 1.75; }
    .lnd  { fill: none; stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .ln   { fill: none; stroke: currentColor; stroke-opacity: .45; stroke-width: 1.5; marker-end: url(#oracle-bridge-arw); }
    .lna  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; marker-end: url(#oracle-bridge-acc); }
    .dot  { fill: currentColor; fill-opacity: .32; }
    .dota { fill: var(--diagram-accent, #ffa726); fill-opacity: .85; }
  </style>
  <text class="l" x="40" y="34">Външни факти в договор, който никой не контролира</text>

  <rect class="box" x="40" y="62" width="196" height="176" rx="8" stroke-dasharray="5 4"/>
  <text class="l" x="58" y="90">off-chain</text>
  <text class="s" x="58" y="118">земетресение</text>
  <text class="s" x="58" y="142">ценови поток</text>
  <text class="s" x="58" y="166">резултат от мач</text>
  <text class="s" x="58" y="190">статус на полет</text>
  <text class="s" x="58" y="218">непредвидими входове</text>

  <path class="ln" d="M240 150 H264"/>

  <rect class="accf" x="272" y="76" width="196" height="156" rx="8"/>
  <text class="a" x="290" y="104">Оракъл мрежа</text>
  <circle class="dota" cx="302" cy="138" r="11"/>
  <circle class="dota" cx="332" cy="138" r="11"/>
  <circle class="dota" cx="362" cy="138" r="11"/>
  <circle class="dota" cx="392" cy="138" r="11"/>
  <text class="s" x="290" y="178">независими източници</text>
  <text class="s" x="290" y="198">плаща им се за точност</text>
  <text class="s" x="290" y="218">губят при лъжа</text>

  <path class="lna" d="M472 150 H496"/>

  <rect class="fill" x="504" y="62" width="176" height="176" rx="8"/>
  <text class="l" x="522" y="90">on-chain</text>
  <rect class="box" x="522" y="112" width="140" height="70" rx="6"/>
  <text class="l" x="538" y="140">смарт договор</text>
  <text class="s" x="538" y="162">плаща автоматично</text>
  <text class="s" x="522" y="218">всичко е предвидимо</text>

  <text class="s" x="40" y="284">Ако един контролира източника, договорът е децентрализиран само на думи.</text>
</svg>
