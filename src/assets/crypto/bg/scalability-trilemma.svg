<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-label="Трилемата на мащабируемостта" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="scalability-trilemma-arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="currentColor" fill-opacity=".45"/>
    </marker>
    <marker id="scalability-trilemma-acc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="var(--diagram-accent, #ffa726)"/>
    </marker>
  </defs>
  <style>
    .t  { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .l  { font: 600 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; }
    .s  { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: currentColor; fill-opacity: .62; }
    .m  { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: currentColor; fill-opacity: .72; }
    .a  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent, #ffa726); }
    .g  { font: 600 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: var(--diagram-accent-2, #eac168); }
    .box  { fill: none; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .fill { fill: currentColor; fill-opacity: .05; stroke: currentColor; stroke-opacity: .26; stroke-width: 1.5; }
    .acc  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .accf { fill: var(--diagram-accent, #ffa726); fill-opacity: .1; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; }
    .gold { fill: none; stroke: var(--diagram-accent-2, #eac168); stroke-width: 1.75; }
    .lnd  { fill: none; stroke: currentColor; stroke-opacity: .35; stroke-width: 1.5; stroke-dasharray: 4 4; }
    .ln   { fill: none; stroke: currentColor; stroke-opacity: .45; stroke-width: 1.5; marker-end: url(#scalability-trilemma-arw); }
    .lna  { fill: none; stroke: var(--diagram-accent, #ffa726); stroke-width: 1.75; marker-end: url(#scalability-trilemma-acc); }
    .dot  { fill: currentColor; fill-opacity: .32; }
    .dota { fill: var(--diagram-accent, #ffa726); fill-opacity: .85; }
  </style>
  <text class="l" x="40" y="34">Може да максимизираш две от трите, не и трите</text>

  <path class="acc" d="M360 66 L588 276 L132 276 Z"/>
  <circle class="dota" cx="360" cy="66" r="6"/>
  <circle class="dota" cx="588" cy="276" r="6"/>
  <circle class="dota" cx="132" cy="276" r="6"/>

  <text class="a" x="360" y="52" text-anchor="middle">Сигурност</text>
  <text class="a" x="112" y="300" text-anchor="middle">Децентрализация</text>
  <text class="a" x="612" y="300" text-anchor="middle">Мащабируемост</text>

  <text class="s" x="360" y="186" text-anchor="middle">избери две</text>

  <circle class="dot" cx="246" cy="171" r="5"/>
  <text class="l" x="60" y="150">PoW / PoS</text>
  <text class="s" x="60" y="168">бавни, много трудни за атака</text>

  <circle class="dot" cx="474" cy="171" r="5"/>
  <text class="l" x="486" y="150">PoA</text>
  <text class="s" x="486" y="168">бързи, известни валидатори</text>

  <circle class="dot" cx="360" cy="276" r="5"/>
  <text class="l" x="360" y="320" text-anchor="middle">DPoS — 20 до 100 делегата: бързо финализиране, много по-малък кръг валидатори</text>
</svg>
